<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
<title>PN-07 GreenPulse energy monitoring architecture</title>
<desc>Schematic: React+TS frontend to Node/Express API (REST/WS), Python ML service (LSTM forecast, anomaly alerts) and MQTT ingest, feeding Redis, TimescaleDB and InfluxDB.</desc>
