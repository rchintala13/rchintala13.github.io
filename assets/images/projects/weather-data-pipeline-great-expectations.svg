<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace" letter-spacing="0.06em">
<title>PN-09 Weather Data Pipeline with Great Expectations</title>
<desc>Blueprint schematic: Open-Meteo API to async extractors, GCS staging, BigQuery raw, Great Expectations gate (Slack alert on fail), dbt marts, Looker Studio, orchestrated by Prefect hourly.</desc>
<defs>
<pattern id="minor" width="16" height="16" patternUnits="userSpaceOnUse">
<path d="M16 0 L0 0 0 16" fill="none" stroke="#EAF3FB" stroke-opacity="0.05" stroke-width="1"/>
</pattern>
<pattern id="major" width="80" height="80" patternUnits="userSpaceOnUse">
<path d="M80 0 L0 0 0 80" fill="none" stroke="#EAF3FB" stroke-opacity="0.09" stroke-width="1"/>
</pattern>
<marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
<path d="M0,0 L8,4 L0,8 z" fill="#EAF3FB" fill-opacity="0.8"/>
</marker>
<marker id="ahA" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
<path d="M0,0 L8,4 L0,8 z" fill="#9FDBFF"/>
</marker>
</defs>

<rect x="0" y="0" width="640" height="360" fill="#0D3B66"/>
<rect x="0" y="0" width="640" height="360" fill="url(#minor)"/>
<rect x="0" y="0" width="640" height="360" fill="url(#major)"/>

<!-- title strip -->
<rect x="16" y="16" width="608" height="22" fill="#EAF3FB" fill-opacity="0.06" stroke="#EAF3FB" stroke-opacity="0.6" stroke-width="1"/>
<text x="28" y="31" font-size="10" fill="#EAF3FB">PN-09 · WEATHER-DATA-PIPELINE-GREAT-EXPECTATIONS · HOURLY ELT WITH QUALITY GATE</text>

<!-- row 1 -->
<g font-size="9" fill="#EAF3FB" text-anchor="middle">
<rect x="28" y="64" width="116" height="48" fill="#EAF3FB" fill-opacity="0.04" stroke="#EAF3FB" stroke-opacity="0.6" stroke-width="1"/>
<text x="86" y="84">OPEN-METEO API</text>
<text x="86" y="98" fill-opacity="0.7">HOURLY OBS</text>

<rect x="184" y="64" width="116" height="48" fill="#EAF3FB" fill-opacity="0.04" stroke="#EAF3FB" stroke-opacity="0.6" stroke-width="1"/>
<text x="242" y="84">PYTHON EXTRACTORS</text>
<text x="242" y="98" fill-opacity="0.7">ASYNC HTTPX</text>

<rect x="340" y="64" width="116" height="48" fill="#EAF3FB" fill-opacity="0.04" stroke="#EAF3FB" stroke-opacity="0.6" stroke-width="1"/>
<text x="398" y="84">GCS STAGING</text>
<text x="398" y="98" fill-opacity="0.7">RAW/{DATE}/</text>

<rect x="496" y="64" width="116" height="48" fill="#EAF3FB" fill-opacity="0.04" stroke="#EAF3FB" stroke-opacity="0.6" stroke-width="1"/>
<text x="554" y="84">BIGQUERY RAW</text>
<text x="554" y="98" fill-opacity="0.7">RAW_WEATHER</text>
</g>

<!-- row 1 arrows -->
<g stroke="#EAF3FB" stroke-opacity="0.7" stroke-width="1" fill="none">
<line x1="146" y1="88" x2="182" y2="88" marker-end="url(#ah)"/>
<line x1="302" y1="88" x2="338" y2="88" marker-end="url(#ah)"/>
<line x1="458" y1="88" x2="494" y2="88" marker-end="url(#ah)"/>
</g>

<!-- BQ to GX key path -->
<line x1="554" y1="112" x2="554" y2="190" stroke="#9FDBFF" stroke-width="1" marker-end="url(#ahA)"/>
<text x="562" y="152" font-size="9" fill="#9FDBFF">VALIDATE</text>

<!-- row 2 -->
<g font-size="9" fill="#EAF3FB" text-anchor="middle">
<rect x="496" y="192" width="116" height="64" fill="#9FDBFF" fill-opacity="0.08" stroke="#9FDBFF" stroke-width="1"/>
<text x="554" y="210" fill="#9FDBFF">GX VALIDATION</text>
<text x="554" y="224" fill-opacity="0.7">SCHEMA · NULLS &lt;5%</text>
<text x="554" y="236" fill-opacity="0.7">RANGES · ROWS</text>
<text x="554" y="248" fill-opacity="0.7">FRESHNESS &lt;3H</text>

<rect x="340" y="192" width="116" height="64" fill="#EAF3FB" fill-opacity="0.04" stroke="#EAF3FB" stroke-opacity="0.6" stroke-width="1"/>
<text x="398" y="210">DBT MODELS</text>
<text x="398" y="224" fill-opacity="0.7">STG·INT·MARTS</text>
<text x="398" y="236" fill-opacity="0.7">INCREMENTAL</text>

<rect x="184" y="192" width="116" height="64" fill="#EAF3FB" fill-opacity="0.04" stroke="#EAF3FB" stroke-opacity="0.6" stroke-width="1"/>
<text x="242" y="210">LOOKER STUDIO</text>
<text x="242" y="224" fill-opacity="0.7">DASHBOARDS</text>
</g>

<line x1="494" y1="224" x2="458" y2="224" stroke="#9FDBFF" stroke-width="1" marker-end="url(#ahA)"/>
<text x="476" y="214" font-size="9" fill="#9FDBFF" text-anchor="middle">PASS</text>
<line x1="338" y1="224" x2="302" y2="224" stroke="#EAF3FB" stroke-opacity="0.7" stroke-width="1" marker-end="url(#ah)"/>

<!-- fail path to Slack -->
<line x1="554" y1="256" x2="554" y2="275" stroke="#EAF3FB" stroke-opacity="0.7" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<text x="562" y="270" font-size="9" fill="#EAF3FB" fill-opacity="0.7">FAIL</text>
<rect x="496" y="276" width="116" height="24" fill="none" stroke="#EAF3FB" stroke-opacity="0.6" stroke-width="1" stroke-dasharray="4 3"/>
<text x="554" y="292" font-size="9" fill="#EAF3FB" text-anchor="middle">SLACK ALERT + HALT</text>

<!-- readouts -->
<g font-size="9" fill="#EAF3FB" fill-opacity="0.7" text-anchor="middle">
<rect x="28" y="276" width="112" height="24" fill="none" stroke="#EAF3FB" stroke-opacity="0.5" stroke-width="1"/>
<text x="84" y="292"><tspan fill="#9FDBFF" font-size="11">50+</tspan> CITIES</text>
<rect x="156" y="276" width="112" height="24" fill="none" stroke="#EAF3FB" stroke-opacity="0.5" stroke-width="1"/>
<text x="212" y="292"><tspan fill="#9FDBFF" font-size="11">&lt;5%</tspan> NULLS</text>
<rect x="284" y="276" width="112" height="24" fill="none" stroke="#EAF3FB" stroke-opacity="0.5" stroke-width="1"/>
<text x="340" y="292"><tspan fill="#9FDBFF" font-size="11">&lt;3H</tspan> FRESHNESS</text>
</g>

<!-- orchestration bar -->
<rect x="28" y="316" width="584" height="20" fill="none" stroke="#EAF3FB" stroke-opacity="0.5" stroke-width="1"/>
<text x="320" y="330" font-size="9" fill="#EAF3FB" fill-opacity="0.7" text-anchor="middle">PREFECT · HOURLY FLOW ORCHESTRATION</text>
</svg>